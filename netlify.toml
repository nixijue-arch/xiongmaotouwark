[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# /api/search-pandas + /api/proxy-image 联网搜表情包后端
# 必须在 SPA fallback 之前
[[redirects]]
  from = "/api/search-pandas"
  to = "/.netlify/functions/search-pandas"
  status = 200

[[redirects]]
  from = "/api/proxy-image"
  to = "/.netlify/functions/proxy-image"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ⭐ Permissions-Policy header — 允许 clipboard-write (Chrome 122+ 默认 block, 需明确 allow)
# 修 "Copy failed: Clipboard API has been blocked because of a permissions policy" 错误.
# clipboard-write=(self) 仅允许 same-origin, 不开放给第三方 iframe.
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "clipboard-write=(self), clipboard-read=(self)"
